<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>fashion platform</title>
</head>

<body>
    <header class="header">

        <div class="container header__container">
            <div class="header__logo">
                <span class="header__logo-rotate">FASHION</span>
                <span class="header__logo-main">FASHION</span>
            </div>
            <nav class="header__nav">
                <a href="">New Perspective</a>
                <a href="">Stories</a>
                <a href="">Statement</a>
                <a href="">Creators</a>
            </nav>
        </div>

    </header>

    <section class="hero">

        <img src="img/hero-model.png" alt="model" class="hero__model">
        <h1 class="hero__title">
            RAW
        </h1>

    </section>

    <section class="new-perspective">

        <div class="squares-decor">
            <span class="square square--1"></span>
            <span class="square square--2"></span>
            <span class="square square--3"></span>
            <span class="square square--4"></span>
            <span class="square square--5"></span>
            <span class="square square--6"></span>
            <span class="square square--7"></span>
            <span class="square square--8"></span>
            <span class="square square--9"></span>
            <span class="square square--10"></span>
            <span class="square square--11"></span>
            <span class="square square--12"></span>
            <span class="square square--13"></span>
            <span class="square square--14"></span>
            <span class="square square--15"></span>
            
        </div>

        <div class="container new-perspective__container">
            <div class="new-perspective__item">
                <img src="img/perspectives/perspective-1.jpg" alt="" class="new-perspective__img">
                <div class="new-perspective__content">
                    <h2>FIND YOUR OWN LANGUAGE</h2>
                    <p>Fashions begins where imitation ends</p>
                </div>
            </div>
            <div class="new-perspective__item">
                <div class="new-perspective__content">
                    <h2>WEAR WHAT FEELS LIKE YOU</h2>
                    <p>Not for approval. Not for rules. For yourself</p>
                </div>
                <img src="img/perspectives/perspective-2.jpg" alt="" class="new-perspective__img">
                
            </div>
        </div>

    </section>

    <section class="statement">
         <div class="statement__decor-square squares-decor">
            <span class="square square--1"></span>
            <span class="square square--2"></span>
            <span class="square square--3"></span>
            <span class="square square--4"></span>
            <span class="square square--5"></span>
            <span class="square square--6"></span>
            <span class="square square--7"></span>
            <span class="square square--8"></span>
            <span class="square square--9"></span>
            <span class="square square--10"></span>
           
            <span class="square square--12"></span>
            <span class="square square--13"></span>
            <span class="square square--14"></span>
            <span class="square square--15"></span>
            
            <span class="square square--17"></span>
            <span class="square square--18"></span>
            <span class="square square--19"></span>
            <span class="square square--20"></span>
            <span class="square square--21"></span>
        </div>
        <div class="statement__container">
            
                <div class="statement__text">
                    <span class="statement__decor-line"></span>
                    <p>don’t blend in</p>
                </div>
                <img src="img/statement/statement-1.jpg" alt="" class="statement__img statement__img--1">
                <img src="img/statement/statement-2.jpg" alt="" class="statement__img statement__img--2">
                <img src="img/statement/sttement-3.jpg" alt="" class="statement__img statement__img--3">
                <div class="statement__title">
                   
                    <h2>BE SEEN</h2>
                    <span class="statement__decor-line"></span>
                </div>
            
        </div>
    </section>


    <script>
        const items = document.querySelectorAll('.new-perspective__item');

const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
        if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
        }
    });
}, {
    threshold: 0.15
});

items.forEach((item) => {
    observer.observe(item);
});
    </script>
</body>

</html>
